name: amylodb
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy>=1.24
  - pandas>=2.0
  - openpyxl>=3.1
  - requests>=2.28
  - pyyaml>=6.0
  - scikit-learn>=1.3
  - networkx>=3.0
  - pytest>=7.0
  - ruff
  # Mining extras (CPU). torch CPU wheel is pulled via pip for reproducibility.
  - spacy>=3.5
  - tqdm>=4.65
  - pip
  - pip:
      - transformers>=4.30,<5
      - torch>=2.0        # on the Mac the default wheel includes MPS (Apple GPU)
      - sentencepiece>=0.1.99
      - protobuf>=3.20
      - huggingface_hub>=0.23
      - zshot==0.0.11
      - gliner>=0.2.5
      - scispacy>=0.5.4
      - anthropic>=0.18
      - openai>=1.0
      - xgboost>=2.0
