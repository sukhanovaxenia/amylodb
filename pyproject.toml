[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amylodb"
version = "0.1.0"
description = "Unified amyloid database: curated sources reconciled with literature mining, with provenance, graded evidence tiers and a fixed feature matrix."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xenia Sukhanova", email = "sukhanovaxenia@gmail.com" }]
keywords = ["amyloid", "bioinformatics", "database", "LLPS", "RNP condensates"]

# Core runtime: curated parsing, reconciliation, features, export. No ML / LLM
# dependencies here, so a plain build runs without torch or transformers.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "openpyxl>=3.1",   # CPAD Excel sources
    "requests>=2.28",  # UniProt / NCBI fetch in curated.utils
    "pyyaml>=6.0",     # config files
]

[project.optional-dependencies]
# Literature mining (run on a machine with network + model access).
mining = [
    "transformers>=4.30,<5",   # <5 as required by OpenBioNER-v2
    "torch>=2.0",
    "sentencepiece>=0.1.99",   # mDeBERTa-v3 tokenizer
    "protobuf>=3.20",
    "huggingface_hub>=0.23",   # scripts/fetch_models.py
    "spacy>=3.5",
    "scispacy>=0.5.4",
    "zshot==0.0.11",           # OpenBioNER-v2 linker; version pinned by the model authors
    "gliner>=0.2.5",           # required by zshot at import time
    "anthropic>=0.18",
    "openai>=1.0",
    "tqdm>=4.65",
]
# Downstream ML consumers / baselines.
ml = ["scikit-learn>=1.3", "xgboost>=2.0"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
amylodb = "amylodb.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["amylodb*"]   # guard: never ship a stray top-level package

[tool.setuptools.package-data]
amylodb = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: end-to-end runs with stubbed network and models"]
